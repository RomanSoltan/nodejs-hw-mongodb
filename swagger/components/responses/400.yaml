description: Bad request error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: BadRequestError
        data:
          type: object
          required:
            - message
            - errors
          properties:
            message:
              type: string
              example: 'Bad Request'
            errors:
              type: object
              properties:
                message:
                  type: string
                  example: Phone number is required
                path:
                  type: array
                  example: phoneNumber
                type:
                  type: string
                  example: any.required
                context:
                  type: object
                  properties:
                    label:
                      type: string
                      example: phoneNumber
                    key:
                      type: string
                      example: phoneNumber
